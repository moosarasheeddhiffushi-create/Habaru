:root{
  --red:#2c4cfd; --ink:#141a2b; --muted:#6b7280; --line:#e6e8ec;
  --bg:#ffffff; --soft:#f5f6f8; --radius:14px;
  --body-font:"MV Waheed Site","MV Waheed","Faruma",sans-serif;
  --head-font:"Aaamu FK","MV Aaamu FK","Faruma",sans-serif;
  --title-font:"Aaamu FK","MV Aaamu FK","Faruma",sans-serif;
}
*{box-sizing:border-box}
h1,h2,h3,.logo{font-weight:400;font-synthesis:none}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body-font);font-size:20px;line-height:1.9}
a{color:inherit;text-decoration:none}
a:hover .headline{color:var(--red)}
img{display:block;width:100%;height:100%;object-fit:cover}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

/* ---------- އިޝްތިހާރު ---------- */
.ad-top{margin:16px auto;max-width:1100px;aspect-ratio:1100/240;border-radius:6px;overflow:hidden;background:var(--soft)}
.ad-label{font-family:sans-serif;font-size:12px;color:var(--muted);text-align:left;direction:ltr}

/* ---------- ހެޑަރު ---------- */
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.05)}
.nav{display:flex;align-items:center;gap:28px;height:84px}
.logo{display:inline-flex;align-items:center;gap:12px;font-family:var(--title-font);font-size:38px;color:var(--red);font-weight:700;line-height:1;white-space:nowrap}
.logo img{width:52px;height:52px;object-fit:contain;flex:none}
footer .logo img{filter:brightness(0) invert(1)}
.menu{display:flex;gap:30px;flex:1;overflow-x:auto;scrollbar-width:none}
.menu a{font-family:var(--body-font);font-size:23px;white-space:nowrap;padding:26px 2px;border-bottom:3px solid transparent}
.menu a.active,.menu a:hover{border-color:var(--red)}
.actions{display:flex;align-items:center;gap:12px;direction:ltr}
.btn{font-family:system-ui,sans-serif;font-size:16px;padding:10px 26px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;cursor:pointer}
.btn.dark{background:var(--ink);color:#fff}
.icon-btn{background:none;border:0;cursor:pointer;padding:6px}
.burger{display:none}

/* ---------- ބައިގެ ސުރުޚީ ---------- */
.section-title{text-align:center;font-family:var(--title-font);font-size:56px;margin:44px 0 18px}
.subnav{display:flex;justify-content:center;gap:56px;flex-wrap:wrap;margin-bottom:36px}
.subnav a{font-family:var(--body-font);font-size:21px;color:#333}
.subnav a:hover{color:var(--red)}

/* ---------- ފޮޓޯ ހުސްނަމަ ---------- */
.ph{background:linear-gradient(135deg,#eceef2,#dfe3ea);position:relative;overflow:hidden}
.ph::after{content:"ފޮޓޯ";position:absolute;inset:0;display:grid;place-items:center;color:#a3a9b5;font-size:20px}
.ph img{position:relative;z-index:1}

/* ---------- މައި ތިން ކޮލަމް ---------- */
.top-grid{display:grid;grid-template-columns:1fr 2fr 1fr;gap:0;border-top:1px solid var(--line)}
.col{padding:24px}
.col+.col{border-right:1px solid var(--line)}
.lead .ph{aspect-ratio:16/9;border-radius:4px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 18px;font-family:var(--body-font);font-size:17px;margin:22px 0 6px}
.lead .headline{font-family:var(--title-font);font-size:44px;line-height:1.75;margin:10px 0}
.lead .excerpt{color:#444;font-size:21px;line-height:2.1}
.meta{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:15px;margin-top:14px}
.meta .num{white-space:nowrap;font-family:system-ui,sans-serif;direction:ltr;display:inline-flex;gap:6px;align-items:center}
.meta .pill{border:1px solid var(--line);border-radius:999px;padding:3px 14px}
.author{display:flex;align-items:center;gap:10px;margin-right:auto}
.author .ph{width:40px;height:40px;border-radius:50%}

.small{display:grid;grid-template-columns:1fr 140px;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.small:first-child{padding-top:0}
.small .ph{aspect-ratio:3/4;border-radius:4px;height:auto}
.small .headline{font-family:var(--head-font);font-size:21px;line-height:1.9;margin:0}
.side .ph{aspect-ratio:4/3;border-radius:4px}
.side .headline{font-family:var(--head-font);font-size:24px;line-height:1.9;margin:14px 0 4px}
.side article{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}

/* ---------- އިތުރު ޚަބަރު ---------- */
.block-title{font-family:var(--title-font);font-size:32px;margin:48px 0 20px;display:flex;align-items:center;gap:14px}
.block-title::after{content:"";flex:1;height:2px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.card .ph{aspect-ratio:16/10;border-radius:8px}
.card .cat{color:var(--red);font-family:var(--body-font);font-size:15px;margin-top:12px}
.card .headline{font-family:var(--head-font);font-size:21px;line-height:1.9;margin:4px 0}

/* ---------- ފުޓަރު ---------- */
footer{margin-top:64px;background:var(--ink);color:#cfd3dc;padding:44px 0 26px}
.foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer .logo{color:#fff}
.foot-links{display:flex;gap:26px;flex-wrap:wrap;font-family:var(--body-font)}
.copy{border-top:1px solid #2c3347;margin-top:26px;padding-top:18px;font-size:14px;text-align:center}


/* ---------- ހަބަރު ފިލްޓަރު / ލިންކު ---------- */
.subnav a.active{color:var(--red);border-bottom:2px solid var(--red)}
.headline a:hover,.card .headline a:hover{color:var(--red)}
.cat{color:var(--red)}
.cat:hover{text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:22px}
.crumbs{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:17px;margin:34px 0 0}
.crumbs a:hover{color:var(--red)}

/* ---------- ހަބަރު ހުޅުވާ ސަފްހާ ---------- */
.article{max-width:860px;margin:0 auto}
.article h1{font-family:var(--title-font);font-weight:400;font-size:48px;line-height:1.7;margin:14px 0 8px}
.article .meta{margin:0 0 24px;flex-wrap:wrap}
.article .hero{aspect-ratio:16/9;border-radius:8px;margin-bottom:28px}
.article .lede{font-size:24px;line-height:2.1;color:#222;margin:0 0 18px}
.article .body p{font-size:21px;line-height:2.2;color:#333;margin:0 0 18px;text-align:justify}
.article .share{display:flex;gap:10px;margin:30px 0;padding-top:20px;border-top:1px solid var(--line)}
.article .share button{font-family:var(--body-font);font-size:17px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 18px;cursor:pointer}
.article .share button:hover{border-color:var(--red);color:var(--red)}
@media (max-width:700px){
  .article h1{font-size:32px}
  .article .lede{font-size:21px}
  .article .body p{font-size:19px}
}

/* ---------- މޯބައިލް ---------- */
@media (max-width:1000px){
  .top-grid{grid-template-columns:1fr}
  .col+.col{border-right:0;border-top:1px solid var(--line)}
  .lead{order:-1}
  .cards{grid-template-columns:repeat(2,1fr)}
  .lead .headline{font-size:32px}
}
@media (max-width:700px){
  .menu{display:none}
  .menu.open{display:flex;flex-direction:column;position:absolute;top:84px;right:0;left:0;background:#fff;padding:8px 16px;gap:0;border-bottom:1px solid var(--line)}
  .menu.open a{padding:12px 0}
  .burger{display:block}
  .actions .btn{display:none}
  .section-title{font-size:40px}
  .subnav{gap:22px}
  .cards{grid-template-columns:1fr}
  .col{padding:18px 0}
  .small{grid-template-columns:1fr 110px}
}
</style>
</head>

/* ======== މިތަނުން ފެށިގެން ބަދަލުކުރަން ނުޖެހޭ ======== */
const clock = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const bubble = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
const pic = (src, cls="") => `<div class="ph ${cls}"><img src="${src}" alt="" loading="lazy" onerror="this.remove()"></div>`;
const art = n => `#/article/${n.id}`;
const catLink = c => `#/cat/${encodeURIComponent(c)}`;
const meta = n => `<div class="meta">
   ${n.comments!==undefined?`<span class="num pill">${bubble}${n.comments}</span>`:""}
   <span class="num">${clock}${n.time}</span></div>`;
const card = n => `<article class="card">
   <a href="${art(n)}">${pic(n.image)}</a>
   <a class="cat" href="${catLink(n.category)}">${n.category}</a>
   <h3 class="headline"><a href="${art(n)}">${n.title}</a></h3>${meta(n)}</article>`;
const app = document.getElementById("app");

document.title = SITE_NAME;
document.querySelectorAll(".logo-text").forEach(l => l.textContent = SITE_NAME);
document.getElementById("siteName").href = "#/";

function renderNav(active){
  document.getElementById("menu").innerHTML =
    `<a href="#/" class="${!active?'active':''}">${HOME_LABEL}</a>` +
    MENU.map(m=>`<a href="${catLink(m)}" class="${active===m?'active':''}">${m}</a>`).join("");
}
const subnav = active => `<nav class="subnav">` +
  SUBNAV.map(s=>`<a href="${catLink(s)}" class="${active===s?'active':''}">${s}</a>`).join("") + `</nav>`;

function home(){
  renderNav(null);
  const lead = ARTICLES.find(a=>a.place==="lead") || ARTICLES[0];
  const side = ARTICLES.filter(a=>a.place==="side");
  const small = ARTICLES.filter(a=>a.place==="small");
  const cards = ARTICLES.filter(a=>a.place==="card");
  app.innerHTML = `
  <h1 class="section-title">${HOME_LABEL}</h1>${subnav(null)}
  <section class="top-grid">
    <div class="col side">${side.map(n=>`<article>
      <a href="${art(n)}">${pic(n.image)}</a>
      <h3 class="headline"><a href="${art(n)}">${n.title}</a></h3>${meta(n)}</article>`).join("")}</div>
    <div class="col lead">
      <a href="${art(lead)}">${pic(lead.image)}</a>
      <a class="chip" href="${catLink(lead.category)}">‹ ${lead.category}</a>
      <h2 class="headline"><a href="${art(lead)}">${lead.title}</a></h2>
      <p class="excerpt">${lead.excerpt}</p>
      <div class="meta">
        <div class="author">${pic(lead.authorImage||"")}<span>${lead.author||DEFAULT_AUTHOR}</span></div>
        <span class="num">${clock}${lead.time}</span>
        ${lead.comments!==undefined?`<span class="num pill">${bubble}${lead.comments}</span>`:""}
      </div>
    </div>
    <div class="col">${small.map(n=>`<div class="small">
      <div><h3 class="headline"><a href="${art(n)}">${n.title}</a></h3>${meta(n)}</div>
      <a href="${art(n)}">${pic(n.image)}</a></div>`).join("")}</div>
  </section>
  <h2 class="block-title">އެންމެ ފަހުގެ ޚަބަރު</h2>
  <section class="cards">${cards.map(card).join("")}</section>`;
}

function category(name){
  renderNav(MENU.includes(name) ? name : null);
  const list = ARTICLES.filter(a=>a.category===name || a.sub===name);
  app.innerHTML = `
  <h1 class="section-title">${name}</h1>${subnav(name)}
  ${list.length ? `<section class="cards">${list.map(card).join("")}</section>`
               : `<p class="empty">މި ބައިގައި އަދި ހަބަރެއް ނެތް</p>`}`;
  document.title = `${name} | ${SITE_NAME}`;
}

function article(id){
  const n = ARTICLES.find(a=>a.id===id);
  if(!n){ location.hash = "#/"; return; }
  renderNav(n.category);
  const body = (n.body && n.body.length ? n.body : DEFAULT_BODY).map(p=>`<p>${p}</p>`).join("");
  let related = ARTICLES.filter(a=>a.id!==n.id && (a.category===n.category || a.sub===n.sub));
  if(related.length < 4) related = related.concat(ARTICLES.filter(a=>a.id!==n.id && !related.includes(a)));
  app.innerHTML = `
  <div class="article">
    <div class="crumbs"><a href="#/">${HOME_LABEL}</a> ‹ <a href="${catLink(n.category)}">${n.category}</a>
      ${n.sub?` ‹ <a href="${catLink(n.sub)}">${n.sub}</a>`:""}</div>
    <h1>${n.title}</h1>
    <div class="meta">
      <div class="author" style="margin-right:0">${pic(n.authorImage||"images/author.jpg")}<span>${n.author||DEFAULT_AUTHOR}</span></div>
      <span class="num">${clock}${n.time}</span>
      ${n.comments!==undefined?`<span class="num pill">${bubble}${n.comments}</span>`:""}
    </div>
    ${pic(n.image,"hero")}
    <p class="lede">${n.excerpt}</p>
    <div class="body">${body}</div>
    <div class="share">
      <button onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href);this.textContent='ލިންކު ކޮޕީކުރެވިއްޖެ'">ލިންކު ކޮޕީކުރޭ</button>
      <button onclick="history.length>1?history.back():location.hash='#/'">ފަހަތަށް</button>
    </div>
  </div>
  <h2 class="block-title">ގުޅޭ ޚަބަރު</h2>
  <section class="cards">${related.slice(0,4).map(card).join("")}</section>`;
  document.title = `${n.title} | ${SITE_NAME}`;
}

function route(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  document.getElementById("menu").classList.remove("open");
  document.title = SITE_NAME;
  if(h.startsWith("article/")) article(h.slice(8));
  else if(h.startsWith("cat/")) category(h.slice(4));
  else home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
